name: daily-pipeline

on:
  schedule:
    - cron: "30 1 * * *"  # 08:30 Vietnam time
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/raw/**", "reports/**", "**.md"]

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Ingest (current + previous month)
        if: github.event_name != 'push'
        run: python ingest.py
      # quality gate: an error-severity dbt test fails the job, so bad data is never committed
      - run: dbt build --project-dir warehouse --profiles-dir warehouse
      - run: python report.py
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add data/raw reports/latest.md reports/summary.json
          git diff --cached --quiet || git commit -m "chore(data): daily refresh $(date -u +%F)"
          git push
